<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ประกันไปกับคุณ">
  <!-- ไอคอนแอปแบบ maskable: เนื้อหาสำคัญอยู่ในวงกลมปลอดภัย 80% ตรงกลาง
       จึงไม่ถูกตัดเสียรูปเมื่อ Android ครอบเป็นวงกลมหรือ squircle -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0B3D91"/>
      <stop offset="55%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#00C2CB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="230" fill="url(#shine)"/>

  <!-- โล่ -->
  <path d="M256 132 L360 172 V262 C360 322 316 364 256 386 C196 364 152 322 152 262 V172 Z"
        fill="#FFFFFF" fill-opacity=".97"/>
  <path d="M256 132 L360 172 V262 C360 322 316 364 256 386 Z"
        fill="#E8F4FF" fill-opacity=".55"/>

  <!-- เครื่องหมายถูก -->
  <path d="M212 258 L243 289 L305 222" fill="none" stroke="#0B3D91"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- เส้นทางเดินทาง สื่อว่า "ไปกับคุณ" -->
  <path d="M120 424 C190 396 322 396 392 424" fill="none" stroke="#14E0C8"
        stroke-width="17" stroke-linecap="round" opacity=".95"/>
  <circle cx="120" cy="424" r="15" fill="#14E0C8"/>
  <circle cx="392" cy="424" r="15" fill="#FFFFFF"/>
</svg>
